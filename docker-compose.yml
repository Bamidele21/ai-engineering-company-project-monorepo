name: nexova-monorepo

services:
  ui:
    build:
      context: ./uis
    ports:
      - "3000:3000" # website
      - "3001:3001" # backoffice
    environment:
      # Browser-facing URLs (resolved by the host browser via published ports).
      NEXT_PUBLIC_SUPPLIERS_API_URL: ${NEXT_PUBLIC_SUPPLIERS_API_URL}
      NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL}
      NEXT_PUBLIC_ANALYZER_API_URL: ${NEXT_PUBLIC_ANALYZER_API_URL}
      NEXT_PUBLIC_TELEMETRY_ENDPOINT: ${NEXT_PUBLIC_TELEMETRY_ENDPOINT}
      # Reliable file watching over Windows/OneDrive bind mounts.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./uis:/app/uis
      # backoffice imports the shared domain logic from the repo-root scripts/
      # directory (`../../../scripts/...` resolves to /app/scripts). Turbopack's
      # root is /app, so this must be mounted alongside /app/uis.
      - ./scripts:/app/scripts:ro
      # Anonymous volumes keep container-installed node_modules from being
      # shadowed by the host's node_modules via the bind mount.
      - /app/uis/website/node_modules
      - /app/uis/backoffice/node_modules
    depends_on:
      - suppliers-api
      - inventory-api
    networks:
      - nexova-net

  suppliers-api:
    build:
      # The image needs both backrooms/services and data/ (the reporting module
      # imports data.pipelines), so the context is the repository root.
      context: .
      dockerfile: backrooms/services/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backrooms/services:/app/backrooms/services
    networks:
      - nexova-net

  inventory-api:
    build:
      context: .
      dockerfile: backrooms/services/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      # Container-to-container Prefect API; do not use localhost here.
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_DEPLOYMENT_NAME: weekly-office-program-performance
    volumes:
      - ./backrooms/services:/app/backrooms/services
      # The reporting router imports data.pipelines from the repository root.
      - ./data:/app/data:ro
    # Same image, different app entrypoint and port.
    command: sh -c "cd /app/backrooms/services/Inventory-API && uvicorn main:app --host 0.0.0.0 --port 8001 --reload"
    depends_on:
      - prefect-server
    networks:
      - nexova-net

  prefect-server:
    build:
      context: .
      dockerfile: data/pipelines/Dockerfile
    command: prefect server start --host 0.0.0.0 --port 4200
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/root/.prefect
    networks:
      - nexova-net

  prefect-worker:
    build:
      context: .
      dockerfile: data/pipelines/Dockerfile
    command: python data/pipelines/start_worker.py
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_DEPLOYMENT_NAME: weekly-office-program-performance
      PREFECT_WORK_POOL: nexova-data-pipelines
      PREFECT_RESULTS_PERSIST_BY_DEFAULT: "true"
      PREFECT_LOCAL_STORAGE_PATH: /app/.prefect-results
    volumes:
      # Deliberately no ./data bind mount: the image carries its own Linux
      # virtualenv under /app/data/pipelines/.venv, and a host bind mount would
      # shadow it with the Windows host copy (Scripts/ instead of bin/).
      - prefect-results:/app/.prefect-results
    depends_on:
      - prefect-server
    networks:
      - nexova-net

networks:
  nexova-net:
    name: nexova-net
    driver: bridge

volumes:
  prefect-data:
  prefect-results:
