[project]
name = "nexova-supply-directory-api"
version = "0.1.0"
description = "Nexova supplier directory TinyDB API"
requires-python = ">=3.11"
dependencies = [
  "dotenv>=0.9.9",
  "fastapi[standard]>=0.116.0",
  "libpass[bcrypt]>=1.9.3",
  "pydantic[email]>=2.11.0",
  "python-dotenv>=1.2.3",
  "python-jose[cryptography]>=3.5.0",
  "resend>=2.0.0",
  "tinydb>=4.8.2",
]

[project.scripts]
seed = "routes.seed:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
include = [
  "main.py",
  "database.py",
  "models.py",
  "auth/*.py",
  "routes/*.py",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["Supply_directory_API/tests"]

[tool.coverage.run]
source = [
    "services.Supply_directory_API.auth",
    "services.Supply_directory_API.routes.auth",
]
